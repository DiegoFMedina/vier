server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # El punto de entrada de Flutter (HTML, bootstrap, service worker, bundle
    # principal, manifest de versión) nunca se cachea: si no, el navegador se
    # queda con una build vieja por días tras cada redeploy, aunque el
    # backend ya haya cambiado de esquema (como pasó con los campos fijos de
    # aprobación al migrar a firmas dinámicas).
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
